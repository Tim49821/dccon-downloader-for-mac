[project]
name = "dccon-macos"
version = "0.1.0"
description = "macOS 디시콘 저장기 - PySide6 + Qt WebEngine"
readme = "README.md"
license = "LicenseRef-DCCon-Attribution-NonCommercial-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dccon = ["js/*.js"]
